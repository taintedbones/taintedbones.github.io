<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Ears -->
  <polygon points="18,38 28,12 38,38" fill="#c12e99"/>
  <polygon points="62,38 72,12 82,38" fill="#c12e99"/>
  <!-- Inner ears -->
  <polygon points="22,36 28,18 34,36" fill="#ffb3ec"/>
  <polygon points="66,36 72,18 78,36" fill="#ffb3ec"/>
  <!-- Head -->
  <ellipse cx="50" cy="55" rx="32" ry="28" fill="#c12e99"/>
  <!-- Eyes -->
  <ellipse cx="38" cy="50" rx="5" ry="6" fill="#1a001a"/>
  <ellipse cx="62" cy="50" rx="5" ry="6" fill="#1a001a"/>
  <!-- Eye shine -->
  <circle cx="40" cy="48" r="1.5" fill="white"/>
  <circle cx="64" cy="48" r="1.5" fill="white"/>
  <!-- Nose -->
  <polygon points="50,59 47,63 53,63" fill="#ffb3ec"/>
  <!-- Mouth -->
  <path d="M47,63 Q44,68 40,66" stroke="#ffb3ec" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <path d="M53,63 Q56,68 60,66" stroke="#ffb3ec" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <!-- Whiskers left -->
  <line x1="18" y1="60" x2="44" y2="62" stroke="#ffb3ec" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="18" y1="65" x2="44" y2="64" stroke="#ffb3ec" stroke-width="1.2" stroke-linecap="round"/>
  <!-- Whiskers right -->
  <line x1="82" y1="60" x2="56" y2="62" stroke="#ffb3ec" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="82" y1="65" x2="56" y2="64" stroke="#ffb3ec" stroke-width="1.2" stroke-linecap="round"/>
</svg>
